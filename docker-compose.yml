services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doramcu
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET:-}
      - DL_MODE=rest
    depends_on:
      mysql:
        condition: service_healthy
      openhands:
        condition: service_started
      dl:
        condition: service_started
    restart: unless-stopped
    # Memory limits: When DL_MODE=rest, the Python DL service handles ML separately,
    # so the Java app needs less memory (4GB is sufficient).
    # When DL_MODE=local (DL4J in-process), increase to 12GB + swap.
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  mysql:
    image: mysql:8.4
    container_name: doramcu-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=doramcu
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  openhands:
    build:
      context: ./dora-ai-openhands
      dockerfile: Dockerfile.openhands
    container_name: doramcu-openhands
    ports:
      - "8082:8082"
    environment:
      - DORA_SERVER_PORT=8082
      - DORA_WORKSPACE=/workspace
      - LLM_MODEL=${LLM_MODEL:-ollama/qwen2.5:14b}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./dora-ai-openhands:/app
      - ./src:/workspace
    restart: unless-stopped

  dl:
    build:
      context: ./dora-dl-python
      dockerfile: Dockerfile.dl
    container_name: doramcu-dl
    ports:
      - "8083:8083"
    volumes:
      - ./dl-models:/app/dl-models
    environment:
      - DORA_DL_PORT=8083
      - DL_MODEL_DIR=/app/dl-models
      - DL_BLEND_FACTOR=0.5
    restart: unless-stopped

volumes:
  mysql-data:
