spring.application.name=DoraAI
server.port=8081
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=60000
server.address=0.0.0.0

# Ollama Configuration
ollama.base-url=http://localhost:11434
ollama.model=llama3
ollama.whisper-model=whisper
ollama.temperature=0.7
ollama.max-tokens=2048
ollama.connect-timeout-ms=5000
ollama.read-timeout-ms=120000

# Google Gemini Configuration (disabled - Free Tier quota exhausted)
gemini.enabled=false
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.model=gemini-3.8-flash
gemini.temperature=0.7
gemini.max-tokens=2048
gemini.connect-timeout-ms=5000
gemini.read-timeout-ms=120000

# DeepSeek Configuration (disabled by default)
deepseek.enabled=true
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
deepseek.temperature=0.7
deepseek.max-tokens=2048
deepseek.connect-timeout-ms=5000
deepseek.read-timeout-ms=120000

# OpenHands / DoraAI2 Configuration (autonomous coding agent)
openhands.enabled=true
openhands.base-url=http://localhost:8082
openhands.mode=chat
openhands.connect-timeout-ms=5000
openhands.read-timeout-ms=300000

# AI Provider Configuration
ai.provider.default=ollama

# Logging Configuration
logging.level.root=INFO
logging.level.com.yisy.modules.doraai=DEBUG

# Logging Pattern - Console
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
