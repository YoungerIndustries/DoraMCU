plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.YISY.modules'
version = '0.1.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot for configuration properties
    api 'org.springframework.boot:spring-boot-starter'

    // Deeplearning4j - neural network for AI game strategy
    api 'org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1'
    api 'org.nd4j:nd4j-native-platform:1.0.0-M2.1'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
