# Development Profile - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:doramcu
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration - auto-create schema for in-memory H2 dev database
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway for in-memory H2 dev database (schema created by Hibernate)
spring.flyway.enabled=false

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable seed data for development environment
app.seed-data=true
